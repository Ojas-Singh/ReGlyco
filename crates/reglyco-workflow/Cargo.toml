[package]
name = "reglyco-workflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license.workspace = true
description = "In-memory workflow orchestration and browser contracts for ReGlyco"
repository = "https://github.com/Ojas-Singh/ReGlyco"

[features]
webgpu = ["full", "reglyco-ensemble/webgpu"]
default = ["public"]
# Refine is part of the public/action bundle.  Density and SAXS remain
# explicitly full-profile capabilities so a public worker cannot advertise or
# execute the unpublished experimental workflows.
public = ["refine"]
refine = []
full = [
    "refine",
    "dep:reglyco-refine",
    "dep:reglyco-saxs",
    "dep:reglyco-density",
    "reglyco-validate/density",
]

[dependencies]
maybe-async-cfg = "0.2.5"
glysys.workspace = true
glysys-energy.workspace = true
reglyco-build = { version = "0.1.0", path = "../reglyco-build" }
reglyco-core = { version = "0.1.0", path = "../reglyco-core" }
reglyco-ensemble = { version = "0.1.0", path = "../reglyco-ensemble" }
reglyco-relax = { version = "0.1.0", path = "../reglyco-relax" }
reglyco-validate = { version = "0.1.0", path = "../reglyco-validate", default-features = false }
reglyco-refine = { version = "0.1.0", path = "../reglyco-refine", optional = true }
reglyco-saxs = { version = "0.1.0", path = "../reglyco-saxs", optional = true }
reglyco-density = { version = "0.1.0", path = "../reglyco-density", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
