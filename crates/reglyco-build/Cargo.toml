[package]
name = "reglyco-build"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license.workspace = true
description = "In-memory glycoprotein attachment and parameterization"
repository = "https://github.com/Ojas-Singh/ReGlyco"

[dependencies]
flate2.workspace = true
glysys.workspace = true
reglyco-core = { version = "0.1.0", path = "../reglyco-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest.workspace = true

[dev-dependencies]
tempfile = "3"
