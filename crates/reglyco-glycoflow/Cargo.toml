[package]
name = "reglyco-glycoflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license.workspace = true
description = "GlycoFlow-guided fitting of glycans of known sequence into density maps"
repository = "https://github.com/Ojas-Singh/ReGlyco"

# Cross-repository dependency: the GlycoFlow inference engine (`glycoflow-core`) lives in the
# GlycoFlow repository (`rust/glycoflow-core`), checked out next to ReGlyco (`../GlycoFlow`, as
# GlySys and crabWURCS are). The dependency is one-way: GlycoFlow never depends on ReGlyco.
# The Python reference of this crate is `glycoflow/fitting/` in the same GlycoFlow checkout.

[features]
default = []
# CUDA network evaluation (build with CUDA_COMPUTE_CAP=<cc> and nvcc on PATH)
cuda = ["glycoflow-core/cuda"]

[dependencies]
candle-core = "0.9.2"
crabwurcs-iupac.workspace = true
crabwurcs-pdb.workspace = true
glycoflow-core = { path = "../../../GlycoFlow/rust/glycoflow-core" }
glysys.workspace = true
rayon.workspace = true
reglyco-density = { version = "0.1.0", path = "../reglyco-density" }
reglyco-validate = { version = "0.1.0", path = "../reglyco-validate" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
