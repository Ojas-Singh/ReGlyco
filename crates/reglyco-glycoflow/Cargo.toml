[package]
name = "reglyco-glycoflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license.workspace = true
description = "GlycoFlow-guided fitting of glycans of known sequence into density maps"
repository = "https://github.com/Ojas-Singh/ReGlyco"

# The GlycoFlow inference engine (`crates/glycoflow-core`) is part of this workspace and open
# source like the rest of ReGlyco. The trained GlycoFlow model (weights, network config, residue
# library) is licensed separately and loaded at run time from a model directory (README.md).
# The Python reference of this crate is `glycoflow/fitting/` in the GlycoFlow repository.

[features]
default = []
# CUDA network evaluation (build with CUDA_COMPUTE_CAP=<cc> and nvcc on PATH)
cuda = ["glycoflow-core/cuda"]

[dependencies]
candle-core = "0.9.2"
crabwurcs-iupac.workspace = true
crabwurcs-pdb.workspace = true
glycoflow-core = { version = "0.1.0", path = "../glycoflow-core" }
glysys.workspace = true
rayon.workspace = true
reglyco-density = { version = "0.1.0", path = "../reglyco-density" }
reglyco-validate = { version = "0.1.0", path = "../reglyco-validate" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
