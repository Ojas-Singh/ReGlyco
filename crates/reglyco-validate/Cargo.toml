[package]
name = "reglyco-validate"
version.workspace = true
edition = "2024"
rust-version = "1.97"
license.workspace = true
description = "Structural validation interfaces for ReGlyco"
repository = "https://github.com/Ojas-Singh/ReGlyco"

[features]
default = ["density"]
density = ["dep:reglyco-density"]

[dependencies]
glysys.workspace = true
reglyco-density = { version = "0.2.3", path = "../reglyco-density", optional = true }
reglyco-core = { version = "0.2.3", path = "../reglyco-core" }
serde.workspace = true
