[package]
name = "reglyco-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license.workspace = true
description = "Command-line interface implementation for ReGlyco"
repository = "https://github.com/Ojas-Singh/ReGlyco"

[dependencies]
anyhow.workspace = true
crabsaxs = { package = "crabsaxs", version = "0.1.0", path = "../../../crabSAXS" }
crabwurcs-core.workspace = true
crabwurcs-iupac.workspace = true
crabwurcs-pdb.workspace = true
clap.workspace = true
glysys.workspace = true
reglyco-build = { version = "0.1.0", path = "../reglyco-build" }
reglyco-core = { version = "0.1.0", path = "../reglyco-core" }
reglyco-density = { version = "0.1.0", path = "../reglyco-density" }
reglyco-ensemble = { version = "0.1.0", path = "../reglyco-ensemble" }
reglyco-refine = { version = "0.1.0", path = "../reglyco-refine" }
reglyco-relax = { version = "0.1.0", path = "../reglyco-relax" }
reglyco-report = { version = "0.1.0", path = "../reglyco-report" }
reglyco-saxs = { version = "0.1.0", path = "../reglyco-saxs" }
reglyco-validate = { version = "0.1.0", path = "../reglyco-validate" }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
sha2.workspace = true
toml = "0.8"
