[package]
name = "glycoflow-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license.workspace = true
description = "GlycoFlow inference engine: GLYCAM builder, torsion kinematics, flow model and ODE sampler"
repository = "https://github.com/Ojas-Singh/ReGlyco"

# The engine is open source (AGPL, as ReGlyco). The trained GlycoFlow model it runs (weights,
# network config and residue library) is licensed separately and is not part of this repository;
# it is loaded at run time from a model directory (see crates/reglyco-glycoflow/README.md).

[features]
default = ["parallel"]
# CPU: evaluate sub-batches on rayon threads (candle CPU elementwise kernels are single-threaded)
parallel = ["dep:rayon"]
# CUDA backend for candle (build with CUDA_COMPUTE_CAP=<cc> and nvcc on PATH)
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.9.2"
candle-nn = "0.9.2"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
regex = "1"
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasm32-unknown-unknown: candle pulls in getrandom; build with
# RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo build -p glycoflow-core --no-default-features --target wasm32-unknown-unknown
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
safetensors = "0.7"
